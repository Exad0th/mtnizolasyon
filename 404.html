<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sayfa bulunamadı — MTN İzolasyon</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#16191C">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .nf {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 22px;
      padding: 40px 24px;
      background: var(--ink-2);
      color: #fff;
    }
    .nf__mark {
      display: inline-flex; align-items: center; justify-content: center;
      width: 64px; height: 64px; background: var(--cream); color: var(--ink-2);
      font-family: var(--display); font-weight: 900; font-size: 22px; letter-spacing: -1px;
    }
    .nf__code { font-family: var(--display); font-weight: 900; font-size: clamp(64px, 16vw, 120px); line-height: 1; color: var(--orange-2); letter-spacing: -2px; }
    .nf h1 { font-family: var(--display); font-weight: 800; font-size: clamp(22px, 4vw, 30px); margin: 0; }
    .nf p { color: var(--dark-muted); font-size: 17px; max-width: 460px; margin: 0; line-height: 1.6; }
  </style>
</head>
<body>
  <main class="nf">
    <span class="nf__mark">MTN</span>
    <div class="nf__code">404</div>
    <h1>Sayfa bulunamadı</h1>
    <p>Aradığınız sayfa taşınmış veya hiç var olmamış olabilir. Ana sayfaya dönerek devam edebilirsiniz.</p>
    <a class="btn btn--primary" href="/">Ana sayfaya dön →</a>
  </main>
</body>
</html>
