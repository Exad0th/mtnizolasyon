# ============================================================
#  MTN İzolasyon — nginx yapılandırması
#
#  BU DOSYAYA ŞU AN İHTİYACINIZ YOK.
#
#  www.mtnizolasyon.com'da nginx yalnızca ters vekil; istekleri Apache
#  karşılıyor ve .htaccess çalışıyor. Yapmanız gereken tek şey depodaki
#  .htaccess dosyasını siteyle birlikte yüklemek.
#
#  Bu dosya yalnızca şu iki durumda gerekir:
#    1) Barındırma saf nginx'e (Apache'siz) taşınırsa
#    2) Statik dosyaları nginx doğrudan servis ediyorsa ve .htaccess'teki
#       önbellek/güvenlik başlıkları görsellere uygulanmıyorsa —
#       o zaman yalnızca 5. ve 7. bölümü barındırıcıya iletin.
# ============================================================

server {
    listen 443 ssl http2;
    server_name mtnizolasyon.com;

    # --- 1) www'suz -> www'lu (KOPYA İÇERİK GİDERİLİR) ---
    # Şu an her iki adres de aynı içeriği 200 ile veriyor.
    # Sitedeki canonical etiketleri www'lu adresi işaret ediyor.
    return 301 https://www.mtnizolasyon.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.mtnizolasyon.com;

    root /var/www/mtnizolasyon;   # <-- gerçek site dizini ile değiştirin
    index index.html;

    charset utf-8;

    # --- 2) /index.html -> /  (aynı sayfanın iki adresi olmasın) ---
    if ($request_uri ~ "^(.*/)index\.html$") {
        return 301 $1;
    }

    # --- 3) Dizin tabanlı temiz URL ---
    # /hizmetler/ -> /hizmetler/index.html  (nginx bunu index yönergesiyle yapar)
    # Sondaki eğik çizgi eksikse ekle: /hizmetler -> /hizmetler/
    location / {
        try_files $uri $uri/ =404;
    }

    # --- 4) Hata sayfası ---
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # --- 5) Güvenlik başlıkları ---
    add_header X-Content-Type-Options        "nosniff" always;
    add_header Referrer-Policy               "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options               "SAMEORIGIN" always;
    add_header Permissions-Policy            "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
    add_header Strict-Transport-Security     "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy       "default-src 'self'; base-uri 'self'; object-src 'none'; img-src 'self' data: https://*.googleapis.com https://*.gstatic.com; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self' 'unsafe-inline'; frame-src https://www.google.com https://maps.google.com; frame-ancestors 'self'; form-action 'self'" always;

    # --- 6) Sıkıştırma ---
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/html text/css text/plain text/xml application/javascript application/json image/svg+xml application/manifest+json;
    # brotli varsa (modül kuruluysa) tercih edilir:
    # brotli on;
    # brotli_types text/html text/css application/javascript application/json image/svg+xml;

    # --- 7) Önbellek ---
    # Görseller ve fontlar: dosya adı değişmeden içerik değişmiyor
    location ~* \.(webp|jpe?g|png|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }
    # HTML: her zaman tazele
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }
    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=3600" always;
    }

    # --- 8) Doğru MIME türleri ---
    types {
        image/webp                webp;
        application/manifest+json webmanifest;
        font/woff2                woff2;
    }

    # --- 9) Yayına ait olmayan dosyaları kapat ---
    location ~ /\.(git|htaccess) { deny all; }
    location ~* \.(bak|zip|md|py)$ { deny all; }
    location ~ ^/(_kurulum|_kaldirilan-gorseller|images-original)/ { deny all; }

    # Dizin listelemeyi kapat
    autoindex off;
}

# --- HTTP -> HTTPS (şu an zaten çalışıyor, teyit amaçlı) ---
server {
    listen 80;
    server_name mtnizolasyon.com www.mtnizolasyon.com;
    return 301 https://www.mtnizolasyon.com$request_uri;
}
